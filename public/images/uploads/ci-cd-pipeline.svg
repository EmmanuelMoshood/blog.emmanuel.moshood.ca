<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t">
  <title id="t">CI/CD pipeline: commit, build, test, scan, deploy</title>
  <rect width="960" height="300" rx="16" fill="#f4f2ee"/>
  <g font-family="system-ui, Segoe UI, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <g fill="#ffffff" stroke="#1d5fd1" stroke-width="2">
      <rect x="30" y="110" width="140" height="80" rx="10"/>
      <rect x="215" y="110" width="140" height="80" rx="10"/>
      <rect x="400" y="110" width="140" height="80" rx="10"/>
